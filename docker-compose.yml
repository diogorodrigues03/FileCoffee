services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - PORT=3030
      - TURN_URL=turn:coturn:3478
      - TURN_SECRET=${TURN_SECRET:?Set TURN_SECRET in .env (see .env.example)}
      - TURN_REALM=${TURN_REALM:-localhost}
    ports:
      - "3030:3030"
    depends_on:
      - coturn

  frontend:
    build:
      context: ./frontend/filecoffee-frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

  coturn:
    image: coturn/coturn
    restart: always
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "49160-49200:49160-49200/udp"
    command:
      - -n
      - --log-file=stdout
      - --min-port=49160
      - --max-port=49200
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?Set TURN_SECRET in .env (see .env.example)}
      - --realm=${TURN_REALM:-localhost}
      # --- Hardening: this is a public relay, don't let it reach private networks ---
      # WebRTC only needs UDP relaying to other peers' public addresses.
      - --fingerprint
      - --no-tcp-relay
      - --no-multicast-peers
      - --stale-nonce=600
      # Limit allocations per user (credentials are per peer) and overall
      - --user-quota=12
      - --total-quota=1200
      # Block relaying to loopback, private, link-local, CGNAT and reserved ranges.
      # This stops the relay being used to reach the backend, other containers,
      # cloud metadata (169.254.169.254) or the host's LAN.
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.0.0.0-192.0.0.255
      - --denied-peer-ip=192.0.2.0-192.0.2.255
      - --denied-peer-ip=192.88.99.0-192.88.99.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=198.18.0.0-198.19.255.255
      - --denied-peer-ip=198.51.100.0-198.51.100.255
      - --denied-peer-ip=203.0.113.0-203.0.113.255
      - --denied-peer-ip=240.0.0.0-255.255.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
      - --denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
